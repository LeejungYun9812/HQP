function renderMaster(){masterBody.innerHTML=masterData.map((x,i)=>`<tr><td>${esc(x.model)}</td><td>${esc(x.partNo)}</td><td>${qty(x.forecast)}</td><td><input type="number" step="0.01" min="0" value="${x.unitPrice||0}" onchange="updatePrice(${i},this.value)"></td></tr>`).join('')}function updatePrice(i,v){masterData[i].unitPrice=Number(v)||0;localStorage.setItem('HQP_PRICES',JSON.stringify(Object.fromEntries(masterData.map(x=>[x.model,x.unitPrice]))));log('Master','Update',`${masterData[i].model} unit price = ${money(v)}`);renderAll()}
let contractDraft=[];
function addContractItem(){let m=cModel.value,q=Number(cQty.value);if(q<=0)return alert(state.lang==='ko'?'수량을 입력하세요.':'Enter quantity.');let found=contractDraft.find(x=>x.model===m);if(found)found.qty+=q;else contractDraft.push({model:m,qty:q});cQty.value='';renderContractDraft()}
function removeContractItem(i){contractDraft.splice(i,1);renderContractDraft()}
function renderContractDraft(){contractDraftBody.innerHTML=contractDraft.map((x,i)=>{let it=item(x.model),amt=x.qty*(it?.unitPrice||0);return`<tr><td>${esc(x.model)}</td><td>${esc(it?.partNo||'')}</td><td><input type="number" min="1" value="${x.qty}" onchange="contractDraft[${i}].qty=Number(this.value);renderContractDraft()"></td><td class="money">${money(it?.unitPrice)}</td><td class="money">${money(amt)}</td><td><button class="btn red" onclick="removeContractItem(${i})">${T[state.lang].delete}</button></td></tr>`}).join('')}
function saveContractBatch(){let no=cNo.value.trim(),a=Number(cAdvance.value);if(!no)return alert(state.lang==='ko'?'계약번호를 입력하세요.':'Enter contract number.');if(!contractDraft.length)return alert(state.lang==='ko'?'계약 품목을 1개 이상 추가하세요.':'Add at least one contract item.');if(state.contracts.some(x=>x.no===no)&&!confirm(state.lang==='ko'?'동일 계약번호가 있습니다. 품목을 추가하시겠습니까?':'This contract number already exists. Add items?'))return;let now=Date.now();contractDraft.forEach((x,i)=>{let existing=state.contracts.find(r=>r.no===no&&r.model===x.model);if(existing){existing.qty+=x.qty;existing.date=cDate.value;existing.advance=Math.max(0,Math.min(100,a||0))}else state.contracts.push({id:now+i,no,date:cDate.value,model:x.model,qty:x.qty,advance:Math.max(0,Math.min(100,a||0))})});log('Contract','Add',`${no} / ${contractDraft.length} items / ${contractDraft.reduce((s,x)=>s+x.qty,0)} EA`);contractDraft=[];cNo.value='';cQty.value='';save();renderAll()}
function delContract(id){if(!confirm('삭제하시겠습니까?'))return;let x=state.contracts.find(x=>x.id===id);state.contracts=state.contracts.filter(x=>x.id!==id);log('Contract','Delete',x?`${x.no} / ${x.model}`:'');save();renderAll()}function editContract(id,field,v){let x=state.contracts.find(x=>x.id===id);if(!x)return;let oldNo=x.no;if(field==='advance'||field==='date'||field==='no'){state.contracts.filter(r=>r.no===oldNo).forEach(r=>r[field]=field==='advance'?Number(v):v)}else{x[field]=field==='qty'?Number(v):v}log('Contract','Edit',`${oldNo} ${field} = ${v}`);save();renderAll()}
function renderContracts(){contractBody.innerHTML=state.contracts.map(x=>{let i=item(x.model),amt=x.qty*(i?.unitPrice||0);return`<tr><td><input value="${esc(x.no)}" onchange="editContract(${x.id},'no',this.value)"></td><td><input type="date" value="${esc(x.date)}" onchange="editContract(${x.id},'date',this.value)"></td><td>${esc(x.model)}</td><td>${esc(i?.partNo||'')}</td><td><input type="number" value="${x.qty}" onchange="editContract(${x.id},'qty',this.value)"></td><td class="money">${money(i?.unitPrice)}</td><td class="money">${money(amt)}</td><td><input type="number" min="0" max="100" value="${x.advance}" onchange="editContract(${x.id},'advance',this.value)"></td><td><button class="btn red" onclick="delContract(${x.id})">${T[state.lang].delete}</button></td></tr>`}).join('')}
function addShipment(){let bl=sBl.value.trim(),q=Number(sQty.value),m=sModel.value,no=sContract.value;if(!bl||q<=0)return alert(state.lang==='ko'?'BL No와 수량을 입력하세요.':'Enter BL No and quantity.');if(!no)return alert(state.lang==='ko'?'계약 No.를 선택하세요.':'Select a contract.');let ordered=state.contracts.filter(x=>x.no===no&&x.model===m).reduce((s,x)=>s+x.qty,0),shipped=state.shipments.filter(x=>x.contractNo===no&&x.model===m).reduce((s,x)=>s+x.qty,0);if(!ordered)return alert(state.lang==='ko'?'선택한 계약에 해당 기종이 없습니다.':'The model is not included in the contract.');if(q>ordered-shipped)return alert((state.lang==='ko'?'계약잔량을 초과했습니다. 잔량: ':'Quantity exceeds contract balance. Balance: ')+(ordered-shipped));state.shipments.push({id:Date.now(),bl,etd:sEtd.value,eta:sEta.value,contractNo:no,model:m,qty:q,status:sStatus.value});log('Shipment','Add',`${bl} / ${m} / ${q}`);sBl.value='';sQty.value='';save();renderAll()}function delShipment(id){if(!confirm('삭제하시겠습니까?'))return;let x=state.shipments.find(x=>x.id===id);state.shipments=state.shipments.filter(x=>x.id!==id);log('Shipment','Delete',x?`${x.bl} / ${x.model}`:'');save();renderAll()}function editShipment(id,field,v){let x=state.shipments.find(x=>x.id===id);if(!x)return;x[field]=field==='qty'?Number(v):v;log('Shipment','Edit',`${x.bl} ${field} = ${v}`);save();renderAll()}
function renderShipments(){shipmentBody.innerHTML=state.shipments.map(x=>{let i=item(x.model),amt=x.qty*(i?.unitPrice||0);return`<tr><td><input value="${esc(x.bl)}" onchange="editShipment(${x.id},'bl',this.value)"></td><td><input type="date" value="${esc(x.etd)}" onchange="editShipment(${x.id},'etd',this.value)"></td><td><input type="date" value="${esc(x.eta)}" onchange="editShipment(${x.id},'eta',this.value)"></td><td>${esc(x.contractNo)}</td><td>${esc(x.model)}</td><td>${esc(i?.partNo||'')}</td><td><input type="number" value="${x.qty}" onchange="editShipment(${x.id},'qty',this.value)"></td><td class="money">${money(amt)}</td><td><select onchange="editShipment(${x.id},'status',this.value)">${Object.keys(statusText.ko).map(k=>`<option value="${k}" ${x.status===k?'selected':''}>${statusText[state.lang][k]}</option>`).join('')}</select></td><td><button class="btn red" onclick="delShipment(${x.id})">${T[state.lang].delete}</button></td></tr>`}).join('')}
function contracted(m){return state.contracts.filter(x=>x.model===m).reduce((s,x)=>s+x.qty,0)}function updateInv(m,f,v){state.inventory[m][f]=Math.max(0,Number(v)||0);log('Inventory','Edit',`${m} ${f} = ${v}`);save();renderAll()}function shippedByModel(m){return state.shipments.filter(x=>x.model===m).reduce((s,x)=>s+x.qty,0)}
function renderInventory(){inventoryBody.innerHTML=masterData.map(x=>{let inv=state.inventory[x.model],c=contracted(x.model),sh=shippedByModel(x.model),shipBal=x.forecast-sh,avail=x.forecast+inv.ludun+inv.hed,short=Math.max(0,sh-avail);let statusTextValue,statusClass;if(shipBal>=0){statusTextValue=T[state.lang].withinForecast;statusClass='muted'}else if(short===0){statusTextValue=T[state.lang].canRespond;statusClass='ok'}else{statusTextValue=T[state.lang].additionalOrder;statusClass='danger'}return`<tr><td>${esc(x.model)}</td><td>${esc(x.partNo)}</td><td>${x.forecast}</td><td>${c}</td><td>${sh}</td><td class="${shipBal<0?'danger':''}">${shipBal}</td><td><input type="number" min="0" value="${inv.ludun}" onchange="updateInv('${esc(x.model)}','ludun',this.value)"></td><td><input type="number" min="0" value="${inv.hed}" onchange="updateInv('${esc(x.model)}','hed',this.value)"></td><td>${avail}</td><td class="${short?'danger':'ok'}">${short}</td><td class="${statusClass}">${statusTextValue}</td></tr>`}).join('')}
function shipAmtFor(no){return state.shipments.filter(x=>x.contractNo===no).reduce((s,x)=>s+x.qty*(item(x.model)?.unitPrice||0),0)}function renderFinance(){let nos=[...new Set(state.contracts.map(x=>x.no))];financeBody.innerHTML=nos.map(no=>{let cs=state.contracts.filter(x=>x.no===no),ca=cs.reduce((s,x)=>s+x.qty*(item(x.model)?.unitPrice||0),0),rate=cs[0]?.advance||0,adv=ca*rate/100,sa=shipAmtFor(no),bal=Math.max(0,adv-sa),due=Math.max(0,sa-adv);return`<tr><td>${esc(no)}</td><td class="money">${money(ca)}</td><td>${rate.toFixed(1)}%</td><td class="money">${money(adv)}</td><td class="money">${money(sa)}</td><td class="money">${money(bal)}</td><td class="money">${money(due)}</td></tr>`}).join('')}
function renderHistory(){historyBody.innerHTML=state.history.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.menu)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('')}function clearHistory(){if(confirm('변경 이력을 삭제하시겠습니까?')){state.history=[];save();renderAll()}}
function dashboard(){let f=masterData.reduce((s,x)=>s+x.forecast,0),c=state.contracts.reduce((s,x)=>s+x.qty,0),sh=state.shipments.reduce((s,x)=>s+x.qty,0),lu=Object.values(state.inventory).reduce((s,x)=>s+x.ludun,0),he=Object.values(state.inventory).reduce((s,x)=>s+x.hed,0),ca=state.contracts.reduce((s,x)=>s+x.qty*(item(x.model)?.unitPrice||0),0),sa=state.shipments.reduce((s,x)=>s+x.qty*(item(x.model)?.unitPrice||0),0);kForecast.textContent=qty(f);kContract.textContent=qty(c);kShipment.textContent=qty(sh);kRemaining.textContent=qty(f-c);kLudun.textContent=qty(lu);kHed.textContent=qty(he);kContractAmt.textContent='$ '+money(ca);kShipmentAmt.textContent='$ '+money(sa)}
function renderAll(){renderNav();translate();options();renderMaster();renderContractDraft();renderContracts();renderShipments();renderInventory();renderFinance();renderHistory();dashboard()}
let prices=JSON.parse(localStorage.getItem('HQP_PRICES')||'{}');masterData.forEach(x=>x.unitPrice=Number(prices[x.model]||0));cDate.value=new Date().toISOString().slice(0,10);sEtd.addEventListener('change',()=>{if(sEtd.value&&!sEta.value){let d=new Date(sEtd.value);d.setDate(d.getDate()+10);sEta.value=d.toISOString().slice(0,10)}});renderAll();
</script></body></html>
